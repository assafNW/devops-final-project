name: Destroy Infrastructure

on:
  workflow_dispatch:  # manual trigger only

env:
  AWS_REGION: us-east-2
  TF_WORKING_DIR: terraform/deploy_infra
  CLUSTER_NAME: seyoawe-prod

jobs:
  destroy:
    name: Destroy EKS and Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.31.0'

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Cleanup ALBs and security groups
        run: |
          kubectl delete ingress --all -n seyoawe --ignore-not-found
          kubectl delete ingress --all -n monitoring --ignore-not-found
          echo "Waiting for LBC to clean up ALBs and security groups..."
          sleep 90
        continue-on-error: true  # don't fail if cluster is already gone

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy --auto-approve

      - name: Verify cleanup
        run: |
          echo "Checking for orphaned security groups..."
          aws ec2 describe-security-groups \
            --filters "Name=tag:Project,Values=seyoawe" \
            --query "SecurityGroups[].[GroupId,GroupName]" \
            --region ${{ env.AWS_REGION }}
          echo "Checking for orphaned ALBs..."
          aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?contains(LoadBalancerName,'seyoawe')].[LoadBalancerName,State.Code]" \
            --region ${{ env.AWS_REGION }}
        continue-on-error: true