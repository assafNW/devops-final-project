name: Destroy Infrastructure

on:
  workflow_dispatch:  # manual trigger only

env:
  AWS_REGION: us-east-2
  TF_INFRA_WORKING_DIR: terraform/deploy_infra
  TF_HELM_WORKING_DIR: terraform/helm
  CLUSTER_NAME: seyoawe-prod

jobs:
  destroy:
    name: Destroy EKS and Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.31.0'
      
      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.14.0'
      
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Helm uninstall app and monitoring
        run: |
          helm uninstall seyoawe -n seyoawe --ignore-not-found || true
          helm uninstall seyoawe-monitoring -n monitoring --ignore-not-found || true
          helm uninstall aws-load-balancer-controller -n kube-system --ignore-not-found || true
          echo "Waiting for LBC to clean up AWS resources..."
          sleep 120
        continue-on-error: true

      - name: Terraform Init - Helm
        working-directory: ${{ env.TF_HELM_WORKING_DIR }}
        run: terraform init
      
      - name: Terraform destroy helm
        working-directory: ${{ env.TF_HELM_WORKING_DIR }}
        run: terraform destroy --auto-approve

      - name: Terraform Init - Infrastructure  
        working-directory: ${{ env.TF_INFRA_WORKING_DIR }}
        run: terraform init

      - name: Terraform destroy infrastructure
        working-directory: ${{ env.TF_INFRA_WORKING_DIR }}
        run: terraform destroy --auto-approve