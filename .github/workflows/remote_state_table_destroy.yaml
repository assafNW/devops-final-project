name: Destroy remote_state_table

on: 
  workflow_dispatch:

env: 
  AWS_REGION: us-east-2
  TF_WORKING_DIR: terraform/remote_state_table

jobs:
  terraform:
    name: Terraform Destroy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init
      
      - name: Terraform Collect Data From AWS 
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Syncing S3 Bucket state..."
          # Target the exact resource and name from your file, allowing fallback if already gone
          terraform import aws_s3_bucket.terraform_state seyoawe-terraform-bucket-332211 || echo "S3 bucket already deleted or tracked."
          
          echo "Syncing DynamoDB Table state..."
          # Target the exact DynamoDB table name from your file, allowing fallback if already gone
          terraform import aws_dynamodb_table.terraform_locks seyoawe-terraform-state-locking || echo "DynamoDB table already deleted or tracked."

          terraform apply --auto-approve

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy --auto-approve