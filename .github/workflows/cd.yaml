name: CD - Deploy SeyoAWE

on: 
  workflow_dispatch:
  # workflow_run:
  #   workflows: ["CI - SeyoAWE Testing"]
  #   types:
  #     - completed
  #   branches: 
  #     - main

env: 
  AWS_REGION: us-east-2
  TF_WORKING_DIR: terraform/deploy_infra
  ANSIBLE_CONFIG: ansible/ansible.cfg

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      cluster_name: ${{ steps.tf_outputs.outputs.eks_cluster_name }}
      efs_id: ${{ steps.tf_outputs.outputs.efs_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply --auto-approve
      
      - name: Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "efs_id=$(terraform output -raw efs_id)" >> $GITHUB_OUTPUT

  # Deploy to AWS EKS via Ansible
  ansible:
    name: Deploy to EKS via Ansible
    runs-on: ubuntu-latest
    needs: terraform
    if: success()
    outputs:
      app_url:     ${{ steps.deploy_seyoawe.outputs.app_url }}
      grafana_url: ${{ steps.deploy_monitoring.outputs.grafana_url }}

    env: 
      TF_OUTPUT_CLUSTER_NAME: ${{ needs.terraform.outputs.cluster_name }}
      TF_OUTPUT_EFS_ID: ${{ needs.terraform.outputs.efs_id }}
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
    
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
      
      - name: Set version from git tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install Ansible
        run: pip install ansible

      - name: Debug Terraform outputs
        run: |
          echo "TF_OUTPUT_CLUSTER_NAME=[$TF_OUTPUT_CLUSTER_NAME]"
          echo "TF_OUTPUT_EFS_ID=[$TF_OUTPUT_EFS_ID]"

      - name: Deploy SeyoAWE app
        run: |
          ansible-playbook  ansible/playbooks/deploy_seyoawe.yaml \
            -i ansible/inventory/hosts.ini
          echo "app_url=http://$(cat /tmp/ingress_url.txt)" >> $GITHUB_OUTPUT
        id: deploy_seyoawe
      
      - name: Deploy monitoring
        run: |
          ansible-playbook ansible/playbooks/deploy_monitoring.yaml \
            -i ansible/inventory/hosts.ini
          echo "grafana_url=http://$(kubectl get ingress -n monitoring \
            -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')/grafana" >> $GITHUB_OUTPUT
        id: deploy_monitoring

  # SUCCESS - if all tests passed, do tag version increase and push images to Dockerhub
  publish:
    name: Success email
    runs-on: ubuntu-latest
    needs: [terraform, ansible]
    if: success() && github.ref == 'refs/heads/main'

    steps:
      
      - name: Send success email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CD Pipeline <${{ secrets.SMTP_USERNAME }}>"
          subject: "CD SUCCESS - ${{ github.repository }} - run #${{ github.run_number }}"
          body: |
            CD pipeline succeed on ${{ github.repository }}.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered: ${{ github.actor }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            App Hostname: ${{ needs.ansible.outputs.app_url }}
            Grafana Dashboard: ${{ needs.ansible.outputs.grafana_url }}
  
  # Failure - Destroy terraform deployment, open Jira ticket and send email
  on-failure:
    name: Failure Notifications
    runs-on: ubuntu-latest
    needs: [terraform, ansible]
    if: |
      always() && 
      (
      needs.terraform.results != 'success' ||
      needs.ansible.results != 'success'
      )

    steps:
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Open Jira bug ticket
        uses: atlassian/gajira-create@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          project: ${{ secrets.JIRA_PROJECT_KEY }}
          issuetype: Bug
          summary: "CD failure - ${{ github.repository }} - run #${{ github.run_number }}"
          description: |
            *Pipeline:* ${{ github.workflow }}
            *Branch:* ${{ github.ref_name }}
            *Commit:* ${{ github.sha }}
            *Run:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            *Triggered by: ${{ github.actor }}
            
            CD failed on run #${{ github.run_number}}.

      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CD Pipeline <${{ secrets.SMTP_USERNAME }}>"
          subject: "CD FAILED - ${{ github.repository }} - run #${{ github.run_number }}"
          body: |
            CD pipeline failed on ${{ github.repository }}.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered: ${{ github.actor }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            A Jira bug ticket has been opened in project ${{ secrets.JIRA_PROJECT_KEY }}.