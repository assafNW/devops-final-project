# This Grafana dashboard fetches ID 15661 directly from Grafana dashboards site via sidecar
apiVersion: v1
kind: ConfigMap
metadata: 
  name: {{ .Release.Name }}-dashboard-15661
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Fetch the ID from grafana.com automatically!
    grafana_dashboard_folder: "Kubernetes"
    download_dashboard: "15661" 
data:
  # A valid placeholder key/value pair to process the map
  kubernetes-dashboard-15661.json: '{"gnetId":15661,"version":1}'