# ServiceMonitor scrapes the engine container.
# Engine serves static assets on port 9000 which returns 200 at /.
# This monitors basic up/down status.

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: 
  name: seyoawe-engine
  namespace: {{ .Release.Namespace }}
  labels:
    app: seyoawe-engine
    release: {{ .Release.Name }}
spec:
  selector: 
    matchLabels:
      app: seyoawe-engine
  namespaceSelector:
    matchNames:
      - seyoawe
  endpoints:
    - port: health
      path: /
      interval: 30s
      scrapeTimeout: 10s