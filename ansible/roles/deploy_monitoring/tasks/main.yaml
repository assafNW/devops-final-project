# Deploys the grafana and prometheus stack helm chart to monitor the app.
# Run eks_auth role before this role
---

- name: Add prometheus-community Helm repo
  command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
  changed_when: false

- name: Update Helm repo
  command: helm repo update
  changed_when: false

- name: Run helm dependency update
  command: helm dependency update {{ monitoring_chart_path }}
  args:
    chdir: "{{ repo_root }}"
  changed_when: true

# Download grafana dashboard 15661 JSON from grafana api.
# force: true re-fetches on every deploy so new revisions are picked up automatically.
- name: Download Grafana dashboard 15661 JSON
  get_url:
    url: "{{ dashboard_url }}"
    dest: "{{ dashboard_dest }}"
    mode: 0644
    force: true

- name: Verify dashboard JSON was downloaded
  stat:
    path: "{{ dashboard_dest }}"
  register: dashboard_file
  failed_when: not dashboard_file.stat.exists

- name: Strip hardcoded VictoriaMetrics template variables from dashboard targets
  replace:
    path: "{{ dashboard_dest }}"
    regexp: '"uid": "\${DS__VICTORIAMETRICS-PROD-ALL}"'
    replace: '"uid": ""'

- name: Strip hardcoded fallback prometheus template UIDs
  replace:
    path: "{{ dashboard_dest }}"
    regexp: '"uid": "WAYOn0FGz"'
    replace: '"uid": ""'

- name: Clean top-level template variable datasource references
  replace:
    path: "{{ dashboard_dest }}"
    regexp: '"datasource": "\${DS__VICTORIAMETRICS-PROD-ALL}"'
    replace: '"datasource": null'

- name: Deploy monitoring chart
  command: >
    helm upgrade --install {{ monitoring_release_name }} {{ monitoring_chart_path }}
    --namespace {{ monitoring_namespace }}
    --create-namespace
    --values {{ monitoring_chart_path }}/values.yaml
    --set kube-prometheus-stack.grafana.adminPassword={{ grafana_password }}
    --set-file dashboards.d15661.json={{ dashboard_dest }}
    --timeout 15m
    --atomic
    --wait
  register: helm_monitoring_result
  args:
    chdir: "{{ repo_root }}"
  changed_when: >
    'has been upgraded' in helm_monitoring_result.stdout or
    'has been deployed' in helm_monitoring_result.stdout
  no_log: false

- name: Print Helm output
  debug:
    msg: "{{ helm_monitoring_result.stdout_lines }}"

- name: Wait for Grafana to be ready
  command: >
    kubectl rollout status deployment/{{ monitoring_release_name }}-grafana
    --namespace {{ monitoring_namespace }}
    --timeout=5m
  changed_when: false

- name: Print monitoring pods status
  command: kubectl get pods -n {{ monitoring_namespace }} -o wide
  register: monitoring_pods_status
  changed_when: false

- name: Show monitoring pods
  debug:
    msg: "{{ monitoring_pods_status.stdout_lines }}"