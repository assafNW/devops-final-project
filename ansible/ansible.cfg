[defaults]
# Inventory file — no need to pass -i on every ansible-playbook command
inventory = inventory/hosts.ini

# Roles path — where Ansible looks for roles
roles_path = roles

# Disable host key checking — GitHub Actions runners are ephemeral,
# no known_hosts file exists
host_key_checking = False

# Suppress deprecation warnings in CI output
deprecation_warnings = False

# Show task execution time in output
callbacks_enabled = timer, profile_tasks

# Retry files clutter the workspace — disable them
retry_files_enabled = False

# stdout format — yaml is more readable in GitHub Actions logs
stdout_callback = yaml

[ssh_connection]
# Pipelining speeds up task execution by reducing SSH round-trips
pipelining = True
