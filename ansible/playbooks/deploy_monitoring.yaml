# Deploy the monitoring stack - Grafana + Prometheus.
#
# run the command line:
# ansible-playbook playbook/deploy_monitoring.yaml \
#   -i inventory/hosts.ini
#   -e "deploy_env=prod"
#
# The following deploy_env variables should be provided by github actions:
#  TF_OUTPUT_CLUSTER_NAME --from terraform output
#  GRAFANA_PASSWORD --from repo secrets

- name: Deploy monitoring stack to {{ deploy_env | default('prod') }}
  hosts: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../group_vars/all/main.yaml"

  roles:
      # validating kubeconfig to deploy monitoring
    - role: eks_auth
    - role: deploy_monitoring